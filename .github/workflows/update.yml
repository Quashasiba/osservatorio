name: Aggiorna dati mensili

on:
  schedule:
    # Schedule ottimizzato sulle fonti. Il job riscarica TUTTE le fonti a ogni
    # run, ma ogni fetch è idempotente (salta se il periodo è già nel JSON):
    # aggiungere giorni di retry costa zero e non produce commit doppi.
    #
    # 1) UNRAE pubblica i dati BEV nei primi 1-4 giorni del mese successivo
    #    (es. i dati di maggio 2026 sono usciti il 1° giugno), ma può slittare.
    #    Tentativo serale il 1° alle 17:00 UTC (~19:00 it) per cogliere una
    #    pubblicazione pomeridiana del giorno stesso.
    - cron: "0 17 1 * *"
    #    Poi il 2, 4, 6, 10 e 14 di OGNI mese alle 09:00 UTC (~10:00/11:00 it):
    #    il 2 e il 4 colgono la pubblicazione tipica appena esce, gli altri giorni
    #    coprono eventuali slittamenti senza aspettare il mese dopo.
    #    Questi run mensili ridanno una chance anche a tutte le altre fonti.
    - cron: "0 9 2,4,6,10,14 * *"
    #
    # 2) PoliMi (Osservatorio Innovative Payments) pubblica il dato annuale
    #    cashless intorno al 12 marzo. Run extra il 16 e il 23 marzo per
    #    cogliere il dato anche in caso di slittamento, senza aspettare aprile.
    - cron: "0 9 16,23 3 *"
    #
    # 3) First CISL pubblica il report annuale della desertificazione bancaria
    #    a fine gennaio. Run extra il 31 gennaio e il 7 febbraio (retry) per
    #    cogliere il dato fresco anche se la pubblicazione slitta a inizio mese.
    - cron: "0 9 31 1 *"
    - cron: "0 9 7 2 *"
    #
    # 4) ACI pubblica l'Autoritratto annuale (parco veicolare) in data
    #    variabile (giugno o novembre): lo coprono i run mensili. Run extra il
    #    15 e il 22 dicembre come ultimo controllo prima di fine anno.
    - cron: "0 9 15,22 12 *"

  workflow_dispatch: # Permette di lanciarlo manualmente dal tab Actions

permissions:
  contents: write # Necessario per commit dei dati aggiornati

# Stesso gruppo di refresh-site.yml: i due workflow committano entrambi su
# main e i cron di GitHub partono con ore di ritardo, quindi possono
# sovrapporsi. In coda invece che in parallelo, niente push rifiutati.
concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Fetch dati BEV (UNRAE)
        id: bev
        run: python scripts/fetch_bev.py 2> >(tee "$RUNNER_TEMP/bev.err" >&2)
        continue-on-error: true # Se UNRAE fallisce, continua con gli altri

      - name: Fetch dati pagamenti (PoliMi)
        id: payments
        run: python scripts/fetch_payments.py 2> >(tee "$RUNNER_TEMP/payments.err" >&2)
        continue-on-error: true

      - name: Fetch dati operatori mobili (AGCOM)
        id: mobile
        run: python scripts/fetch_mobile.py 2> >(tee "$RUNNER_TEMP/mobile.err" >&2)
        continue-on-error: true

      - name: Fetch dati desertificazione bancaria (First CISL)
        id: desert
        run: python scripts/fetch_desertificazione.py 2> >(tee "$RUNNER_TEMP/desert.err" >&2)
        continue-on-error: true

      - name: Fetch dati mix energetico (ENTSO-E)
        id: energy
        run: python scripts/fetch_energy_mix.py 2> >(tee "$RUNNER_TEMP/energy.err" >&2)
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        continue-on-error: true

      # bsdtar per scompattare l'Autoritratto, che dal 2025 esce come .rar
      - name: Installa bsdtar
        run: command -v bsdtar || (sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools)
        continue-on-error: true

      - name: Fetch dati parco auto Milano (ACI Autoritratto)
        id: auto_milano
        run: python scripts/fetch_auto_milano.py 2> >(tee "$RUNNER_TEMP/auto_milano.err" >&2)
        continue-on-error: true

      # Esito di ogni fetch in data/fetch_status.json: il sito mostra
      # "Errore di lettura" sotto al topic finché il fetch non torna a
      # funzionare. Lo stderr salvato sopra (tee) dà il messaggio d'errore.
      - name: Registra esito fetch
        if: always()
        run: >-
          python scripts/record_status.py
          bev=${{ steps.bev.outcome }} payments=${{ steps.payments.outcome }}
          mobile=${{ steps.mobile.outcome }} desert=${{ steps.desert.outcome }}
          energy=${{ steps.energy.outcome }} auto_milano=${{ steps.auto_milano.outcome }}

      - name: Genera sito
        run: python scripts/build_site.py

      - name: Commit e push aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento da committare."
          else
            git commit -m "chore: aggiornamento dati $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi

      # continue-on-error fa proseguire il job (le altre fonti vengono
      # comunque aggiornate e committate) ma nasconde i fallimenti: il run
      # risultava sempre verde anche con scraper rotti da mesi. Questo step
      # finale fa diventare rosso il run, e GitHub manda la mail di notifica.
      - name: Segnala fetch falliti
        if: >-
          steps.bev.outcome == 'failure' || steps.payments.outcome == 'failure' ||
          steps.mobile.outcome == 'failure' || steps.desert.outcome == 'failure' ||
          steps.energy.outcome == 'failure' || steps.auto_milano.outcome == 'failure'
        run: |
          echo "::error::Fetch falliti — bev=${{ steps.bev.outcome }} payments=${{ steps.payments.outcome }} mobile=${{ steps.mobile.outcome }} desert=${{ steps.desert.outcome }} energy=${{ steps.energy.outcome }} auto_milano=${{ steps.auto_milano.outcome }}"
          exit 1

      # --- Notifica fallimento (opzionale) ---
      # Decommenta e configura se vuoi notifiche su Slack quando qualcosa va storto.
      # Devi aggiungere SLACK_WEBHOOK_URL come secret nel repo (Settings → Secrets → Actions).
      #
      # - name: Notifica Slack se fallisce
      #   if: failure()
      #   uses: slackapi/slack-github-action@v1.27.0
      #   with:
      #     payload: |
      #       {
      #         "text": "❌ Aggiornamento dati Osservatorio fallito: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
